name: CI

on: [push, pull_request]

jobs:
  lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features rayon -- -D warnings
      - run: cargo test
      - run: cargo test --features rayon
      - run: cargo test --release --features rayon

  bevy-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Installation des dépendances système requises par Bevy (audio, fenêtrage, etc.) sur Linux
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxi-dev libgl1-mesa-dev
      # Teste la compilation de l'exemple Bevy pour s'assurer qu'il ne se casse jamais
      - run: cargo check --example viewer