[package]
name = "tiny-rodriguez-std"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "Bibliothèque minimale et rapide de géométrie différentielle (SO(3), SE(3)) pour la robotique et les drones"
repository = "https://github.com/jorgeandrecastro/tiny-rodriguez-std"
readme = "README.md"
keywords = ["robotics", "geometry", "lie-groups", "drones", "math"]
categories = ["science", "simulation", "mathematics"]
exclude = [".github/", "examples/"]

[features]
default = []
rayon = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }

[workspace]
resolver = "2"
members = [".", "examples/bevy-drone"]
default-members = ["."]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true